spring.application.name=training

spring.datasource.url=${PROD_DB_URL}
spring.datasource.username=${PROD_DB_USERNAME}
spring.datasource.password=${PROD_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Aiven (darmowy plan) ma ok. 20 polaczen, domyslna pula Hikari (10) szybko je wyczerpuje
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

openai.api.key=${OPENAI_API_KEY}
logging.api.key=${LOGGING_API_KEY}
logging.api.callback=${LOGGING_API_CALLBACK}

strava.client-id=${STRAVA_CLIENT_ID}
strava.client-secret=${STRAVA_CLIENT_SECRET}
