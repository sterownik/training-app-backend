spring.application.name=training

# Sekrety: secrets.properties (gitignored) z classpath lub z katalogu uruchomienia, albo zmienne srodowiskowe
spring.config.import=optional:classpath:secrets.properties,optional:file:./secrets.properties

spring.datasource.url=${PROD_DB_URL}
spring.datasource.username=${PROD_DB_USERNAME}
spring.datasource.password=${PROD_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

openai.api.key=${OPENAI_API_KEY}
logging.api.key=${LOGGING_API_KEY}
logging.api.callback=${LOGGING_API_CALLBACK}

strava.client-id=${STRAVA_CLIENT_ID}
strava.client-secret=${STRAVA_CLIENT_SECRET}
